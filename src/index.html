    <!-- Styles CSS intégrés (copier depuis le template) -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      ::selection {
        background: var(--red);
        color: white;
      }
      :root {
        --night-blue: #0a0e27;
        --night-blue-light: #0f132e;
        --night-blue-lighter: #14183a;
        --red: #e74c3c;
        --red-dark: #c0392b;
        --red-light: #ff6b6b;
        --white: #ffffff;
        --white-90: rgba(255, 255, 255, 0.9);
        --white-80: rgba(255, 255, 255, 0.8);
        --white-70: rgba(255, 255, 255, 0.7);
        --white-60: rgba(255, 255, 255, 0.6);
        --gradient-red: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        --gradient-night: linear-gradient(135deg, #0a0e27 0%, #0f132e 50%, #14183a 100%);
        --card-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(231, 76, 60, 0.2);
        --card-hover-shadow:
          0 25px 40px -12px rgba(231, 76, 60, 0.35), 0 0 0 1px rgba(231, 76, 60, 0.5);
      }
      body {
        font-family: 'Poppins', 'Segoe UI', sans-serif;
        background: var(--gradient-night);
        color: var(--white);
        overflow-x: hidden;
        scroll-behavior: smooth;
        position: relative;
      }
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background:
          radial-gradient(circle at 20% 50%, rgba(231, 76, 60, 0.05) 0%, transparent 50%),
          radial-gradient(circle at 80% 80%, rgba(231, 76, 60, 0.03) 0%, transparent 50%);
        pointer-events: none;
        z-index: 0;
        animation: bgPulse 8s ease-in-out infinite;
      }
      @keyframes bgPulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 0.8;
        }
      }

      .floating-shapes {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
      }
      .floating-shape {
        position: absolute;
        background: linear-gradient(135deg, rgba(231, 76, 60, 0.08), rgba(192, 57, 43, 0.03));
        border-radius: 50%;
        animation: floatShape 25s infinite ease-in-out;
      }
      @keyframes floatShape {
        0%,
        100% {
          transform: translateY(0) translateX(0) rotate(0deg);
        }
        25% {
          transform: translateY(-40px) translateX(30px) rotate(5deg);
        }
        50% {
          transform: translateY(30px) translateX(-30px) rotate(-5deg);
        }
        75% {
          transform: translateY(-30px) translateX(40px) rotate(3deg);
        }
      }
      .floating-shape:nth-child(1) {
        width: 300px;
        height: 300px;
        top: -100px;
        left: -100px;
        animation-duration: 20s;
      }
      .floating-shape:nth-child(2) {
        width: 200px;
        height: 200px;
        bottom: 50px;
        right: -50px;
        animation-duration: 18s;
        animation-delay: 2s;
      }
      .floating-shape:nth-child(3) {
        width: 150px;
        height: 150px;
        top: 40%;
        right: 15%;
        animation-duration: 22s;
        animation-delay: 4s;
      }
      .floating-shape:nth-child(4) {
        width: 100px;
        height: 100px;
        bottom: 20%;
        left: 10%;
        animation-duration: 16s;
        animation-delay: 1s;
      }
      .floating-shape:nth-child(5) {
        width: 250px;
        height: 250px;
        top: 60%;
        left: -80px;
        animation-duration: 24s;
        animation-delay: 3s;
      }
      .floating-shape:nth-child(6) {
        width: 120px;
        height: 120px;
        top: 15%;
        right: 30%;
        animation-duration: 19s;
        animation-delay: 5s;
      }

      main {
        position: relative;
        z-index: 1;
      }

      .section-card {
        background: var(--white);
        backdrop-filter: none;
        margin: 40px 0;
        padding: 40px;
        border-radius: 28px;
        border: none;
        transition:
          transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
          box-shadow 0.3s ease;
        box-shadow: var(--card-shadow);
        color: #0a0e27;
        animation: fadeInUp 0.6s ease-out backwards;
      }
      .section-card:hover {
        transform: translateY(-8px);
        box-shadow: var(--card-hover-shadow);
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .section-card .section-header h2,
      .section-card .section-header h2 span {
        color: #0a0e27;
      }
      .section-card .about-text,
      .section-card p,
      .section-card .timeline-content p,
      .section-card .timeline-content h5,
      .section-card .stat-label,
      .section-card .skill-category h4,
      .section-card .timeline-content h4,
      .section-card .timeline-date,
      .section-card .cert-item span,
      .section-card .contact-item p,
      .section-card .contact-item h5,
      .section-card .skill-tag,
      .section-card .project-front p,
      .section-card .project-front h3 {
        color: #1e1e2f;
      }
      .section-card .text-white-80,
      .section-card .text-white-70,
      .section-card .text-white-60 {
        color: #2c2c3a !important;
      }
      .section-card .stat-card {
        background: rgba(231, 76, 60, 0.08);
        border: 1px solid rgba(231, 76, 60, 0.2);
        transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }
      .section-card .stat-number {
        color: var(--red);
      }
      .section-card .timeline::before {
        background: var(--red);
      }
      .section-card .timeline-content {
        background: rgba(231, 76, 60, 0.05);
        border: 1px solid rgba(231, 76, 60, 0.15);
        transition: all 0.3s ease;
      }
      .section-card .timeline-content:hover {
        transform: translateX(8px);
      }
      .section-card .skill-tag {
        background: rgba(231, 76, 60, 0.1);
        color: #0a0e27;
        border: 1px solid rgba(231, 76, 60, 0.3);
        transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        display: inline-block;
        padding: 8px 16px;
        margin: 5px;
        border-radius: 25px;
        font-size: 0.85rem;
        animation: skillFadeIn 0.5s ease-out backwards;
      }
      .skill-tag:nth-child(1) {
        animation-delay: 0.05s;
      }
      .skill-tag:nth-child(2) {
        animation-delay: 0.1s;
      }
      .skill-tag:nth-child(3) {
        animation-delay: 0.15s;
      }
      .skill-tag:nth-child(4) {
        animation-delay: 0.2s;
      }
      .skill-tag:nth-child(5) {
        animation-delay: 0.25s;
      }
      .skill-tag:nth-child(6) {
        animation-delay: 0.3s;
      }
      .skill-tag:nth-child(7) {
        animation-delay: 0.35s;
      }
      .skill-tag:nth-child(8) {
        animation-delay: 0.4s;
      }
      .skill-tag:nth-child(9) {
        animation-delay: 0.45s;
      }
      .skill-tag:nth-child(10) {
        animation-delay: 0.5s;
      }
      @keyframes skillFadeIn {
        from {
          opacity: 0;
          transform: scale(0.8) translateY(10px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      .section-card .skill-tag:hover {
        background: var(--gradient-red);
        color: white;
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
      }
      .section-card .cert-item {
        background: rgba(231, 76, 60, 0.05);
        border: 1px solid rgba(231, 76, 60, 0.2);
        transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        border-radius: 12px;
        overflow: hidden;
      }
      .section-card .cert-item:hover {
        transform: translateY(-6px) scale(1.02);
        background: rgba(231, 76, 60, 0.15);
        border-color: var(--red);
        box-shadow: 0 10px 25px rgba(231, 76, 60, 0.2);
      }
      .section-card .cert-item a {
        text-decoration: none;
        color: inherit;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 15px;
        width: 100%;
        height: 100%;
      }
      .section-card .cert-item i {
        font-size: 1.8rem;
        min-width: 40px;
        text-align: center;
        transition: all 0.3s ease;
      }
      .section-card .cert-item:hover i {
        transform: scale(1.2) rotate(360deg);
      }
      .section-card .cert-item span {
        color: #0a0e27;
        font-size: 0.9rem;
        font-weight: 500;
        line-height: 1.3;
        word-break: break-word;
      }
      .section-card .contact-item {
        background: rgba(231, 76, 60, 0.05);
        border: 1px solid rgba(231, 76, 60, 0.2);
        transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        border-radius: 12px;
        overflow: hidden;
      }
      .section-card .contact-item:hover {
        transform: translateY(-5px);
        background: rgba(231, 76, 60, 0.15);
        border-color: var(--red);
        box-shadow: 0 10px 25px rgba(231, 76, 60, 0.15);
      }
      .section-card .contact-item a {
        text-decoration: none;
        color: inherit;
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 18px;
        width: 100%;
        height: 100%;
      }
      .section-card .contact-item i {
        font-size: 2rem;
        min-width: 50px;
        text-align: center;
        color: var(--red);
        transition: all 0.3s ease;
      }
      .section-card .contact-item:hover i {
        transform: scale(1.2) rotate(360deg);
      }
      .section-card .contact-item h5 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
      }
      .section-card .contact-item p {
        margin: 0;
        font-size: 0.85rem;
        word-break: break-word;
      }
      .section-card .contact-item div {
        flex: 1;
      }
      .section-card .project-front {
        background: rgba(255, 255, 240, 0.98);
        border: 1px solid rgba(231, 76, 60, 0.3);
        transition: all 0.3s ease;
      }
      .section-card .project-front h3,
      .section-card .project-front p {
        color: #0a0e27;
      }

      .section-line {
        background: var(--red);
        height: 3px;
        width: 60px;
        margin: 15px auto 0;
        border-radius: 3px;
        animation: lineExpand 1s ease-out;
      }
      @keyframes lineExpand {
        from {
          width: 0;
          opacity: 0;
        }
        to {
          width: 60px;
          opacity: 1;
        }
      }

      .section-icon {
        background: var(--gradient-red);
        box-shadow: 0 10px 20px rgba(231, 76, 60, 0.3);
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 1.8rem;
        color: white;
        animation: iconFloat 3s ease-in-out infinite;
        transition: all 0.3s ease;
      }
      .section-icon:hover {
        transform: scale(1.1) rotate(360deg);
      }
      @keyframes iconFloat {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      .btn-red {
        background: var(--gradient-red);
        box-shadow: 0 6px 14px rgba(231, 76, 60, 0.3);
        border: none;
        padding: 12px 30px;
        border-radius: 30px;
        font-weight: 600;
        transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        position: relative;
        overflow: hidden;
        color: white;
      }
      .btn-red::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        transition: left 0.5s ease;
      }
      .btn-red:hover::before {
        left: 100%;
      }
      .btn-red:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 25px rgba(231, 76, 60, 0.4);
        color: white;
      }

      .hero-section {
        background: var(--gradient-night);
        color: var(--white);
        position: relative;
        overflow: hidden;
        padding: 80px 0 120px;
      }

      .sticky-nav {
        background: rgba(10, 14, 39, 0.96);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--red);
        position: sticky;
        top: 0;
        z-index: 1000;
        transition: all 0.3s ease;
      }
      .sticky-nav.scrolled {
        background: rgba(10, 14, 39, 0.98);
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
      }
      .nav-link {
        color: var(--white-80) !important;
        font-weight: 500;
        transition: all 0.3s ease;
        position: relative;
      }
      .nav-link:hover {
        color: var(--red) !important;
        transform: translateY(-2px);
      }
      .nav-link.active {
        color: var(--red) !important;
        font-weight: 600;
      }
      .nav-link::after {
        content: '';
        position: absolute;
        bottom: -5px;
        left: 50%;
        width: 0;
        height: 2px;
        background: var(--red);
        transition: all 0.3s ease;
        transform: translateX(-50%);
      }
      .nav-link:hover::after,
      .nav-link.active::after {
        width: 80%;
      }

      .navbar-brand {
        color: white !important;
        font-size: 1.5rem;
        transition: all 0.3s ease;
      }
      .navbar-brand:hover {
        transform: scale(1.05);
      }

      .footer {
        background: #060a1a;
        padding: 40px 0;
        margin-top: 60px;
      }

      @media (max-width: 768px) {
        .section-card {
          padding: 25px;
        }
        .hero-section {
          padding: 60px 0 80px;
        }
        .profile-img {
          width: 150px;
          height: 150px;
        }
        h1.display-4 {
          font-size: 2rem;
        }
        .cert-grid {
          grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)) !important;
        }
        .contact-grid {
          grid-template-columns: 1fr !important;
        }
        .project-card-3d {
          height: 280px;
        }
        .section-card .cert-item a {
          gap: 8px;
        }
        .section-card .cert-item i {
          font-size: 1.4rem;
          min-width: 30px;
        }
        .section-card .cert-item span {
          font-size: 0.8rem;
        }
      }
      @media (max-width: 480px) {
        .hero-buttons .btn {
          display: block;
          width: 100%;
          margin: 10px 0 !important;
        }
        .hero-buttons .btn-red {
          margin-right: 0 !important;
        }
        .contact-item a {
          padding: 12px;
          gap: 10px;
        }
        .contact-item i {
          font-size: 1.5rem;
          min-width: 35px;
        }
        .contact-item h5 {
          font-size: 0.9rem;
        }
        .contact-item p {
          font-size: 0.75rem;
        }
      }

      .project-card-3d {
        position: relative;
        height: 320px;
        cursor: pointer;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }
      .project-card-3d:hover {
        transform: rotateY(180deg);
      }
      .project-front,
      .project-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 20px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      .project-front {
        background: white;
        transform: rotateY(0deg);
        box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.2);
      }
      .project-front .project-icon i {
        transition: all 0.3s ease;
      }
      .project-front:hover .project-icon i {
        transform: scale(1.1);
        animation: shakeIcon 0.5s ease;
      }
      @keyframes shakeIcon {
        0%,
        100% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(10deg);
        }
        75% {
          transform: rotate(-10deg);
        }
      }
      .project-back {
        background: var(--gradient-red);
        color: white;
        transform: rotateY(180deg);
      }
      .project-back p,
      .project-back a {
        color: white;
      }

      .project-tags {
        display: flex;
        gap: 8px;
        margin-top: 15px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .project-tag {
        background: rgba(231, 76, 60, 0.15);
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--red);
      }

      .timeline {
        position: relative;
        padding-left: 30px;
      }
      .timeline::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 2px;
        background: linear-gradient(to bottom, var(--red), var(--red-light));
      }
      .timeline-item {
        position: relative;
        margin-bottom: 30px;
        opacity: 0;
        animation: timelineFadeIn 0.6s ease-out forwards;
      }
      .timeline-item:nth-child(1) {
        animation-delay: 0.1s;
      }
      .timeline-item:nth-child(2) {
        animation-delay: 0.2s;
      }
      .timeline-item:nth-child(3) {
        animation-delay: 0.3s;
      }
      .timeline-item:nth-child(4) {
        animation-delay: 0.4s;
      }
      @keyframes timelineFadeIn {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      .timeline-badge {
        position: absolute;
        left: -42px;
        top: 0;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--gradient-red);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        transition: all 0.3s ease;
        animation: badgePulse 2s infinite;
      }
      @keyframes badgePulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4);
        }
        50% {
          transform: scale(1.1);
          box-shadow: 0 0 0 10px rgba(231, 76, 60, 0);
        }
      }
      .timeline-badge:hover {
        transform: scale(1.2) rotate(360deg);
      }

      .timeline-content {
        background: rgba(231, 76, 60, 0.05);
        border: 1px solid rgba(231, 76, 60, 0.15);
        border-radius: 12px;
        padding: 20px;
        transition: all 0.3s ease;
      }
      .timeline-content:hover {
        transform: translateX(8px);
        border-color: var(--red-light);
      }
      .timeline-date {
        font-weight: 600;
        color: var(--red);
        margin-bottom: 8px;
      }

      .stat-card {
        text-align: center;
        padding: 20px;
        border-radius: 16px;
        position: relative;
        transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        animation: statFadeIn 0.6s ease-out backwards;
      }
      .stat-card:nth-child(1) {
        animation-delay: 0.1s;
      }
      .stat-card:nth-child(2) {
        animation-delay: 0.2s;
      }
      .stat-card:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes statFadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .stat-card:hover {
        transform: translateY(-5px);
      }
      .stat-number {
        font-size: 2.5rem;
        font-weight: 700;
        animation: countUp 1s ease-out;
      }
      @keyframes countUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .stat-label {
        font-size: 0.9rem;
        margin-top: 5px;
      }
      .stat-icon {
        position: absolute;
        bottom: 15px;
        right: 15px;
        font-size: 1.5rem;
        opacity: 0.2;
        transition: all 0.3s ease;
      }
      .stat-card:hover .stat-icon {
        opacity: 0.35;
        transform: scale(1.1) rotate(10deg);
      }

      .hero-buttons .btn {
        transition: all 0.2s;
      }
      html {
        scroll-padding-top: 80px;
      }

      .profile-wrapper {
        position: relative;
        display: inline-block;
        animation: profileBounceIn 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }
      @keyframes profileBounceIn {
        0% {
          opacity: 0;
          transform: scale(0.3);
        }
        50% {
          opacity: 1;
          transform: scale(1.05);
        }
        70% {
          transform: scale(0.95);
        }
        100% {
          transform: scale(1);
        }
      }
      .profile-glow {
        position: absolute;
        top: -10px;
        left: -10px;
        right: -10px;
        bottom: -10px;
        border-radius: 50%;
        background: var(--gradient-red);
        animation: rotate 3s linear infinite;
        opacity: 0.7;
      }
      @keyframes rotate {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .profile-img {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid white;
        box-shadow: 0 5px 30px rgba(231, 76, 60, 0.3);
        position: relative;
        z-index: 1;
        transition: transform 0.3s ease;
      }
      .profile-img:hover {
        transform: scale(1.05) rotate(5deg);
        box-shadow: 0 10px 40px rgba(231, 76, 60, 0.5);
      }
      .profile-badge {
        position: absolute;
        bottom: 10px;
        right: 10px;
        background: var(--gradient-red);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid white;
        z-index: 2;
        color: white;
        animation: badgePulse 2s infinite;
      }

      .hero-wave {
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 100%;
        line-height: 0;
        z-index: 1;
      }

      .cert-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      .contact-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
      @media (max-width: 992px) {
        .cert-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 768px) {
        .cert-grid {
          grid-template-columns: 1fr;
        }
        .contact-grid {
          grid-template-columns: 1fr;
        }
      }

      .skill-category {
        margin-bottom: 25px;
      }
      .skills-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
      }

      .btn-outline-white {
        border: 2px solid white;
        background: transparent;
        color: white;
        padding: 12px 30px;
        border-radius: 30px;
        transition: 0.3s;
        text-decoration: none;
        display: inline-block;
      }
      .btn-outline-white:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-3px);
        color: white;
      }

      .text-red {
        color: var(--red) !important;
      }

      .social-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        margin: 0 5px;
        transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        color: white;
        text-decoration: none;
      }
      .social-icon:hover {
        background: var(--red);
        transform: translateY(-3px) rotate(360deg) scale(1.1);
      }

      .particle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: #e74c3c;
        border-radius: 50%;
        opacity: 0.5;
        animation: floatParticle 12s linear infinite;
      }
      @keyframes floatParticle {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 0.5;
        }
        90% {
          opacity: 0.5;
        }
        100% {
          transform: translateY(-100vh) rotate(360deg);
          opacity: 0;
        }
      }
      .particles-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 0;
      }
      .z-2 {
        z-index: 2;
      }
      .position-relative {
        position: relative;
      }
      .section-header {
        text-align: center;
        margin-bottom: 40px;
      }

      .display-4 {
        animation: titleGlow 2s ease-out;
      }
      @keyframes titleGlow {
        0% {
          opacity: 0;
          text-shadow: 0 0 0 rgba(231, 76, 60, 0);
        }
        50% {
          opacity: 0.5;
          text-shadow: 0 0 20px rgba(231, 76, 60, 0.5);
        }
        100% {
          opacity: 1;
          text-shadow: 0 0 0 rgba(231, 76, 60, 0);
        }
      }
    </style>
  </head>
  <body>
    <div class="floating-shapes">
      <div class="floating-shape"></div>
      <div class="floating-shape"></div>
      <div class="floating-shape"></div>
      <div class="floating-shape"></div>
      <div class="floating-shape"></div>
      <div class="floating-shape"></div>
    </div>
    <app-root></app-root>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- AOS Animation Library JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        AOS.init({
          duration: 800,
          easing: 'ease-in-out',
          once: true,
          offset: 100,
        });
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
        tooltipTriggerList.forEach((el) => {
          try {
            new bootstrap.Tooltip(el);
          } catch (e) {
            /* tooltip optionnel */
          }
        });
      });
    </script>
  </body>
</html>
